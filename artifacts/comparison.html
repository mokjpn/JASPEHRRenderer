<!doctype html><html lang="ja"><meta charset="utf-8"><title>案１・案２ CRF comparison</title><style>body{font:16px sans-serif;margin:18px;color:#203548}button{font:inherit;padding:8px;margin:4px}iframe{width:100%;height:82vh;border:1px solid #ccd4da}p{font-size:14px}</style><h1>同じ入力項目の注釈比較 / Same-field annotation comparison</h1><button id="concept">案１ / Plan 1: BC + DEC</button><button id="target">案２ / Plan 2: Specialization</button><button id="print">Print / Save as PDF</button><p id="status"></p><p>Blank definition-based forms. Plan 1 uses a separate explicit experimental CRF mapping; BC + DEC alone does not determine an SDTM variable. Official codes do not standardize these authoring attributes. 実ブラウザの印刷は未検証です。</p><iframe title="Annotated CRF comparison" sandbox="allow-same-origin allow-modals"></iframe><script>const plans=["\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; font-src 'none'; base-uri 'none'; form-action 'none'\">\u003ctitle>Annotated CRF\u003c/title>\u003cstyle>\n@page{size:A4;margin:16mm;@bottom-right{content:\"Page \" counter(page) \" / \" counter(pages);font-size:9pt;color:#526575}}\n*{box-sizing:border-box}body{font:10pt \"Noto Sans CJK JP\",\"Noto Sans JP\",sans-serif;color:#203548;margin:0;line-height:1.5;overflow-wrap:anywhere}h1{font-size:19pt;line-height:1.4;margin:0 0 8pt}h2{font-size:14pt;margin:16pt 0 8pt}h3{font-size:11pt;margin:0 0 4pt}header{border-bottom:3pt solid #167b85;padding-bottom:10pt}p{margin:5pt 0}small{color:#526575}.notice{background:#edf5f5;padding:9pt;border-left:3pt solid #167b85}.group>h3{background:#e9eff4;padding:6pt;margin-top:12pt;break-after:avoid}.field{border:1px solid #c9d4dd;padding:8pt;margin:6pt 0;break-inside:avoid}.blank{border-bottom:1px solid #879ba9;height:22pt}.annotation{color:#075862;border-left:2pt solid #167b85;padding-left:7pt;font-size:9pt}.binding{font-size:7.5pt;line-height:1.25;margin:3pt 0}.appendix{break-before:page}pre{white-space:pre-wrap;font-size:7.5pt;line-height:1.25;overflow-wrap:anywhere}a{color:#075862}.warning{color:#973c15}footer{font-size:8pt;border-top:1px solid #c9d4dd;margin-top:12pt;padding-top:6pt}@media screen{body{max-width:780px;margin:24px auto;padding:24px;box-shadow:0 1px 12px #ccd4da}.appendix{margin-top:40px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003csmall>PLAN 1 · BC + DEC · ORIGINAL SYNTHETIC STUDY\u003c/small>\u003ch1>Baseline blood-pressure study\u003cbr>血圧研究・ベースライン\u003c/h1>\u003cp>Annotated Case Report Form (CRF) · Study Data Tabulation Model (SDTM)\u003c/p>\u003c/header>\n\u003cp class=\"notice\">Experimental custom authoring annotations; not standard JASPEHR or a finalized Fast Healthcare Interoperability Resources (FHIR) extension. All fields are blank regardless of entered answers. No real patient data. * Required field.\u003c/p>\n\u003cp class=\"notice\">Plan 1 / 案１: Biomedical Concept (BC) + Data Element Concept (DEC) authoring. Official concept codes do not uniquely select an SDTM variable. The separate crfMapping below is an explicit experimental presentation map. Concept-only metadata remains unresolved without it; ID and date-role exceptions are labeled.\u003c/p>\u003csection class=\"group\">\u003ch3>Study and participant / 研究・参加者\u003c/h3>\u003carticle class=\"field\">\u003ch3>Study identifier / 研究ID *\u003c/h3>\u003csmall>study-id · string\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">BC/DEC exception: Official Identifier BCs exist, but no study-specific BC + DEC to DM.STUDYID correspondence was verified in the pinned COSMoS catalog. This is a catalog/context gap, not a BC modeling limitation; the independent CRF map supplies DM.STUDYID.\u003c/p>\u003cp class=\"annotation\">Direct → DM.STUDYID (Study Identifier; base SDTM variable, no specialization ID asserted) (separate experimental CRF mapping; not inferred from BC/DEC)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Study-local subject identifier / 研究内参加者ID *\u003c/h3>\u003csmall>participant-id · string\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">BC/DEC exception: Official Identifier BCs exist, but no study-local subject BC + DEC to DM.SUBJID correspondence was verified in the pinned catalog. The independent CRF map supplies DM.SUBJID, not USUBJID; this does not mean identifiers cannot be modeled with BCs.\u003c/p>\u003cp class=\"annotation\">Direct → DM.SUBJID (Subject Identifier for the Study; base SDTM variable, no specialization ID asserted) (separate experimental CRF mapping; not inferred from BC/DEC)\u003c/p>\u003cp class=\"annotation\">Mapping note: Unique within this study only. DM.USUBJID (Unique Subject Identifier across studies) requires sponsor-managed identity resolution; this demo does not derive it.\u003c/p>\u003c/article>\u003c/section>\u003csection class=\"group\">\u003ch3>Demographics / 人口統計\u003c/h3>\u003carticle class=\"field\">\u003ch3>Birth date / 生年月日 *\u003c/h3>\u003csmall>birth-date · date\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Input birth-date [birthDate] → used to derive DM.AGE (AGE specialization) (separate experimental CRF mapping; not inferred from BC/DEC); concept output: CDISC concept {&quot;bc&quot;:&quot;C69260&quot;,&quot;dec&quot;:&quot;C170981&quot;} (domain unresolved); not a direct mapping.\u003c/p>\u003cp class=\"annotation\">Biomedical Concept (BC) + Data Element Concept (DEC): {&quot;bc&quot;:&quot;C83217&quot;,&quot;dec&quot;:&quot;C82515&quot;}; domain unresolved from this pair alone.\u003c/p>\u003cp class=\"annotation\">Direct → DM.BRTHDTC (BRTHDTC specialization; Date/Time of Birth) (separate experimental CRF mapping; not inferred from BC/DEC)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Age reference date / 年齢基準日 *\u003c/h3>\u003csmall>reference-date · date\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Input reference-date [referenceDate] → used to derive DM.AGE (AGE specialization) (separate experimental CRF mapping; not inferred from BC/DEC); concept output: CDISC concept {&quot;bc&quot;:&quot;C69260&quot;,&quot;dec&quot;:&quot;C170981&quot;} (domain unresolved); not a direct mapping.\u003c/p>\u003cp class=\"annotation\">BC/DEC exception: No separate BC + DEC asserted for this study-specific age-reference date; referenceDate is an input role, not a collection-date concept.\u003c/p>\u003cp class=\"annotation\">Mapping note: Age-reference input only; not DM.RFSTDTC (Subject Reference Start Date/Time) or VS.VSDTC (vital signs collection date/time).\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Sex as collected / 性別\u003c/h3>\u003csmall>sex · choice · F / Female · INTERSEX / Intersex · M / Male · U / Unknown\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation binding\">Contained ValueSet: #demo-sex-values · ValueSet version 2025-03-28-demo-1 · 4 permitted codes (complete offline expansion). https://example.org/jaspehr-demo/CodeSystem/cdisc-sex | CodeSystem version 2025-03-28 \u003c/p>\u003cp class=\"annotation\">Biomedical Concept (BC) + Data Element Concept (DEC): {&quot;bc&quot;:&quot;C28421&quot;,&quot;dec&quot;:&quot;C28421&quot;}; domain unresolved from this pair alone.\u003c/p>\u003cp class=\"annotation\">Direct → DM.SEX (SEX specialization; Sex; codelist C66731) (separate experimental CRF mapping; not inferred from BC/DEC)\u003c/p>\u003c/article>\u003c/section>\u003csection class=\"group\">\u003ch3>Seated baseline vitals / 座位バイタル\u003c/h3>\u003carticle class=\"field\">\u003ch3>Systolic blood pressure (mmHg) / 収縮期血圧 *\u003c/h3>\u003csmall>systolic-bp · integer\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Biomedical Concept (BC) + Data Element Concept (DEC): {&quot;bc&quot;:&quot;C25298&quot;,&quot;dec&quot;:&quot;C70856&quot;}; domain unresolved from this pair alone.\u003c/p>\u003cp class=\"annotation\">Direct → VS.VSORRES (SYSBP specialization; VSTESTCD=SYSBP) (separate experimental CRF mapping; not inferred from BC/DEC)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Diastolic blood pressure (mmHg) / 拡張期血圧\u003c/h3>\u003csmall>diastolic-bp · integer\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Biomedical Concept (BC) + Data Element Concept (DEC): {&quot;bc&quot;:&quot;C25299&quot;,&quot;dec&quot;:&quot;C70856&quot;}; domain unresolved from this pair alone.\u003c/p>\u003cp class=\"annotation\">Direct → VS.VSORRES (DIABP specialization; VSTESTCD=DIABP) (separate experimental CRF mapping; not inferred from BC/DEC)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Pulse (beats/min) / 脈拍\u003c/h3>\u003csmall>pulse · integer\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Biomedical Concept (BC) + Data Element Concept (DEC): {&quot;bc&quot;:&quot;C49676&quot;,&quot;dec&quot;:&quot;C70856&quot;}; domain unresolved from this pair alone.\u003c/p>\u003cp class=\"annotation\">Direct → VS.VSORRES (PULSE specialization; VSTESTCD=PULSE) (separate experimental CRF mapping; not inferred from BC/DEC)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Measurement notes / 測定メモ\u003c/h3>\u003csmall>notes · text\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">BC/DEC exception: Demonstration-only free text; no BC + DEC pair or SDTM submission mapping specified.\u003c/p>\u003cp class=\"annotation\">Not mapped / demonstration-only: Demonstration-only free text; no submission variable or link to an individual vital signs record has been specified.\u003c/p>\u003c/article>\u003c/section>\n\u003csection class=\"appendix\">\u003ch2>Mapping intent and review boundaries\u003c/h2>\u003cp>Clinical Data Interchange Standards Consortium (CDISC) Dataset Specialization targets: VS = Vital Signs; DM = Demographics; STUDYID = Study Identifier; SUBJID = Subject Identifier for the Study; USUBJID = Unique Subject Identifier across studies; BRTHDTC = Date/Time of Birth; SEX = Sex; PULSE = Pulse Rate; DIABP = diastolic blood pressure; VSORRES = original result; VSTESTCD = vital signs test short name; SYSBP = systolic blood pressure; AGE = age.\u003c/p>\n\u003cp class=\"notice\">Derived is this demo’s intent. The official AGE specialization declares Collected. This demo does not claim full specialization compliance, execute derivations, or generate an SDTM dataset.\u003c/p>\n\u003carticle class=\"field\">\u003ch3>Derived direction\u003c/h3>\u003cp>birth-date [birthDate] + reference-date [referenceDate] → CDISC concept {&quot;bc&quot;:&quot;C69260&quot;,&quot;dec&quot;:&quot;C170981&quot;} (domain unresolved) · see separate explicit CRF mapping\u003c/p>\u003cp>Intent: 生年月日と研究基準日から、基準日時点の年齢を年単位で導出する\u003c/p>\u003cp>Optional derivation description (inert text): referenceDateからbirthDateを差し引いた期間を、基準日時点の年齢として年単位で表す。満年齢か小数年齢か、部分日付・閏日・丸め等の扱いは下流仕様で明示的に決定する。\u003c/p>\u003c/article>\n\u003cp>Unresolved downstream decisions: completed years versus fractional age; partial or missing dates; leap-day birthdays; timezone/date boundaries; invalid date order; rounding. No age is calculated in this demonstration.\u003c/p>\n\n\u003ch2>Raw authoring metadata\u003c/h2>\u003cp>The original attributes and unknown metadata are preserved in the downloadable Questionnaire JSON. This display never evaluates annotation content.\u003c/p>\u003ch3>Mapping intents\u003c/h3>\u003cpre>{&quot;inputs&quot;:[{&quot;linkId&quot;:&quot;birth-date&quot;,&quot;role&quot;:&quot;birthDate&quot;},{&quot;linkId&quot;:&quot;reference-date&quot;,&quot;role&quot;:&quot;referenceDate&quot;}],&quot;output&quot;:{&quot;cdiscConcept&quot;:{&quot;bc&quot;:&quot;C69260&quot;,&quot;dec&quot;:&quot;C170981&quot;}},&quot;intent&quot;:&quot;生年月日と研究基準日から、基準日時点の年齢を年単位で導出する&quot;,&quot;derivationDescription&quot;:&quot;referenceDateからbirthDateを差し引いた期間を、基準日時点の年齢として年単位で表す。満年齢か小数年齢か、部分日付・閏日・丸め等の扱いは下流仕様で明示的に決定する。&quot;}\u003c/pre>\n\u003ch2>Separate explicit CRF mapping (experimental)\u003c/h2>\u003cp>These author-selected entries are not standard CDISC mappings and are not inferred from BC/DEC.\u003c/p>\u003cpre>{&quot;status&quot;:&quot;Experimental explicit CRF annotation mapping; never inferred from BC/DEC&quot;,&quot;direct&quot;:[{&quot;linkId&quot;:&quot;study-id&quot;,&quot;target&quot;:{&quot;sdtmVariableTarget&quot;:{&quot;domain&quot;:&quot;DM&quot;,&quot;variable&quot;:&quot;STUDYID&quot;}}},{&quot;linkId&quot;:&quot;participant-id&quot;,&quot;target&quot;:{&quot;sdtmVariableTarget&quot;:{&quot;domain&quot;:&quot;DM&quot;,&quot;variable&quot;:&quot;SUBJID&quot;}}},{&quot;linkId&quot;:&quot;birth-date&quot;,&quot;target&quot;:{&quot;sdtmTarget&quot;:&quot;BRTHDTC.BRTHDTC&quot;}},{&quot;linkId&quot;:&quot;sex&quot;,&quot;target&quot;:{&quot;sdtmTarget&quot;:&quot;SEX.SEX&quot;}},{&quot;linkId&quot;:&quot;systolic-bp&quot;,&quot;target&quot;:{&quot;sdtmTarget&quot;:&quot;SYSBP.VSORRES&quot;}},{&quot;linkId&quot;:&quot;diastolic-bp&quot;,&quot;target&quot;:{&quot;sdtmTarget&quot;:&quot;DIABP.VSORRES&quot;}},{&quot;linkId&quot;:&quot;pulse&quot;,&quot;target&quot;:{&quot;sdtmTarget&quot;:&quot;PULSE.VSORRES&quot;}}],&quot;derived&quot;:[{&quot;linkId&quot;:&quot;demographics&quot;,&quot;target&quot;:{&quot;sdtmTarget&quot;:&quot;AGE.AGE&quot;}}]}\u003c/pre>\u003cfooter>Independent synthetic layout inspired only by the baseline blood-pressure research context of the \u003ca href=\"https://biolincc.nhlbi.nih.gov/studies/sprint/\">Systolic Blood Pressure Intervention Trial (SPRINT)\u003c/a>. No original form, logo, or affiliation. Source design: author-supplied revision 4 examples.\u003c/footer>\u003c/section>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; font-src 'none'; base-uri 'none'; form-action 'none'\">\u003ctitle>Annotated CRF\u003c/title>\u003cstyle>\n@page{size:A4;margin:16mm;@bottom-right{content:\"Page \" counter(page) \" / \" counter(pages);font-size:9pt;color:#526575}}\n*{box-sizing:border-box}body{font:10pt \"Noto Sans CJK JP\",\"Noto Sans JP\",sans-serif;color:#203548;margin:0;line-height:1.5;overflow-wrap:anywhere}h1{font-size:19pt;line-height:1.4;margin:0 0 8pt}h2{font-size:14pt;margin:16pt 0 8pt}h3{font-size:11pt;margin:0 0 4pt}header{border-bottom:3pt solid #167b85;padding-bottom:10pt}p{margin:5pt 0}small{color:#526575}.notice{background:#edf5f5;padding:9pt;border-left:3pt solid #167b85}.group>h3{background:#e9eff4;padding:6pt;margin-top:12pt;break-after:avoid}.field{border:1px solid #c9d4dd;padding:8pt;margin:6pt 0;break-inside:avoid}.blank{border-bottom:1px solid #879ba9;height:22pt}.annotation{color:#075862;border-left:2pt solid #167b85;padding-left:7pt;font-size:9pt}.binding{font-size:7.5pt;line-height:1.25;margin:3pt 0}.appendix{break-before:page}pre{white-space:pre-wrap;font-size:7.5pt;line-height:1.25;overflow-wrap:anywhere}a{color:#075862}.warning{color:#973c15}footer{font-size:8pt;border-top:1px solid #c9d4dd;margin-top:12pt;padding-top:6pt}@media screen{body{max-width:780px;margin:24px auto;padding:24px;box-shadow:0 1px 12px #ccd4da}.appendix{margin-top:40px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003csmall>ORIGINAL SYNTHETIC STUDY · BLANK DEFINITION-BASED FORM\u003c/small>\u003ch1>Baseline blood-pressure study\u003cbr>血圧研究・ベースライン\u003c/h1>\u003cp>Annotated Case Report Form (CRF) · Study Data Tabulation Model (SDTM)\u003c/p>\u003c/header>\n\u003cp class=\"notice\">Experimental custom authoring annotations; not standard JASPEHR or a finalized Fast Healthcare Interoperability Resources (FHIR) extension. All fields are blank regardless of entered answers. No real patient data. * Required field.\u003c/p>\n\u003csection class=\"group\">\u003ch3>Study and participant / 研究・参加者\u003c/h3>\u003carticle class=\"field\">\u003ch3>Study identifier / 研究ID *\u003c/h3>\u003csmall>study-id · string\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Direct → DM.STUDYID (Study Identifier; base SDTM variable, no specialization ID asserted)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Study-local subject identifier / 研究内参加者ID *\u003c/h3>\u003csmall>participant-id · string\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Direct → DM.SUBJID (Subject Identifier for the Study; base SDTM variable, no specialization ID asserted)\u003c/p>\u003cp class=\"annotation\">Mapping note: Unique within this study only. DM.USUBJID (Unique Subject Identifier across studies) requires sponsor-managed identity resolution; this demo does not derive it.\u003c/p>\u003c/article>\u003c/section>\u003csection class=\"group\">\u003ch3>Demographics / 人口統計\u003c/h3>\u003carticle class=\"field\">\u003ch3>Birth date / 生年月日 *\u003c/h3>\u003csmall>birth-date · date\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Input birth-date [birthDate] → used to derive DM.AGE (AGE specialization); not a direct mapping.\u003c/p>\u003cp class=\"annotation\">Direct → DM.BRTHDTC (BRTHDTC specialization; Date/Time of Birth)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Age reference date / 年齢基準日 *\u003c/h3>\u003csmall>reference-date · date\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Input reference-date [referenceDate] → used to derive DM.AGE (AGE specialization); not a direct mapping.\u003c/p>\u003cp class=\"annotation\">Mapping note: Age-reference input only; not DM.RFSTDTC (Subject Reference Start Date/Time) or VS.VSDTC (vital signs collection date/time).\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Sex as collected / 性別\u003c/h3>\u003csmall>sex · choice · F / Female · INTERSEX / Intersex · M / Male · U / Unknown\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation binding\">Contained ValueSet: #demo-sex-values · ValueSet version 2025-03-28-demo-1 · 4 permitted codes (complete offline expansion). https://example.org/jaspehr-demo/CodeSystem/cdisc-sex | CodeSystem version 2025-03-28 \u003c/p>\u003cp class=\"annotation\">Direct → DM.SEX (SEX specialization; Sex; codelist C66731)\u003c/p>\u003c/article>\u003c/section>\u003csection class=\"group\">\u003ch3>Seated baseline vitals / 座位バイタル\u003c/h3>\u003carticle class=\"field\">\u003ch3>Systolic blood pressure (mmHg) / 収縮期血圧 *\u003c/h3>\u003csmall>systolic-bp · integer\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Direct → VS.VSORRES (SYSBP specialization; VSTESTCD=SYSBP)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Diastolic blood pressure (mmHg) / 拡張期血圧\u003c/h3>\u003csmall>diastolic-bp · integer\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Direct → VS.VSORRES (DIABP specialization; VSTESTCD=DIABP)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Pulse (beats/min) / 脈拍\u003c/h3>\u003csmall>pulse · integer\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Direct → VS.VSORRES (PULSE specialization; VSTESTCD=PULSE)\u003c/p>\u003c/article>\u003carticle class=\"field\">\u003ch3>Measurement notes / 測定メモ\u003c/h3>\u003csmall>notes · text\u003c/small>\u003cdiv class=\"blank\">&nbsp;\u003c/div>\u003cp class=\"annotation\">Not mapped / demonstration-only: Demonstration-only free text; no submission variable or link to an individual vital signs record has been specified.\u003c/p>\u003c/article>\u003c/section>\n\u003csection class=\"appendix\">\u003ch2>Mapping intent and review boundaries\u003c/h2>\u003cp>Clinical Data Interchange Standards Consortium (CDISC) Dataset Specialization targets: VS = Vital Signs; DM = Demographics; STUDYID = Study Identifier; SUBJID = Subject Identifier for the Study; USUBJID = Unique Subject Identifier across studies; BRTHDTC = Date/Time of Birth; SEX = Sex; PULSE = Pulse Rate; DIABP = diastolic blood pressure; VSORRES = original result; VSTESTCD = vital signs test short name; SYSBP = systolic blood pressure; AGE = age.\u003c/p>\n\u003cp class=\"notice\">Derived is this demo’s intent. The official AGE specialization declares Collected. This demo does not claim full specialization compliance, execute derivations, or generate an SDTM dataset.\u003c/p>\n\u003carticle class=\"field\">\u003ch3>Derived direction\u003c/h3>\u003cp>birth-date [birthDate] + reference-date [referenceDate] → DM.AGE (AGE specialization)\u003c/p>\u003cp>Intent: 生年月日と研究基準日から、基準日時点の年齢を年単位で導出する\u003c/p>\u003cp>Optional derivation description (inert text): referenceDateからbirthDateを差し引いた期間を、基準日時点の年齢として年単位で表す。満年齢か小数年齢か、部分日付・閏日・丸め等の扱いは下流仕様で明示的に決定する。\u003c/p>\u003c/article>\n\u003cp>Unresolved downstream decisions: completed years versus fractional age; partial or missing dates; leap-day birthdays; timezone/date boundaries; invalid date order; rounding. No age is calculated in this demonstration.\u003c/p>\n\n\u003ch2>Raw authoring metadata\u003c/h2>\u003cp>The original attributes and unknown metadata are preserved in the downloadable Questionnaire JSON. This display never evaluates annotation content.\u003c/p>\u003ch3>Direct targets\u003c/h3>\u003cpre>{&quot;linkId&quot;:&quot;study-id&quot;,&quot;raw&quot;:{&quot;sdtmVariableTarget&quot;:{&quot;domain&quot;:&quot;DM&quot;,&quot;variable&quot;:&quot;STUDYID&quot;}}}\n{&quot;linkId&quot;:&quot;participant-id&quot;,&quot;raw&quot;:{&quot;sdtmVariableTarget&quot;:{&quot;domain&quot;:&quot;DM&quot;,&quot;variable&quot;:&quot;SUBJID&quot;}}}\n{&quot;linkId&quot;:&quot;birth-date&quot;,&quot;raw&quot;:{&quot;sdtmTarget&quot;:&quot;BRTHDTC.BRTHDTC&quot;}}\n{&quot;linkId&quot;:&quot;sex&quot;,&quot;raw&quot;:{&quot;sdtmTarget&quot;:&quot;SEX.SEX&quot;}}\n{&quot;linkId&quot;:&quot;systolic-bp&quot;,&quot;raw&quot;:{&quot;sdtmTarget&quot;:&quot;SYSBP.VSORRES&quot;}}\n{&quot;linkId&quot;:&quot;diastolic-bp&quot;,&quot;raw&quot;:{&quot;sdtmTarget&quot;:&quot;DIABP.VSORRES&quot;}}\n{&quot;linkId&quot;:&quot;pulse&quot;,&quot;raw&quot;:{&quot;sdtmTarget&quot;:&quot;PULSE.VSORRES&quot;}}\u003c/pre>\u003ch3>Mapping intents\u003c/h3>\u003cpre>{&quot;inputs&quot;:[{&quot;linkId&quot;:&quot;birth-date&quot;,&quot;role&quot;:&quot;birthDate&quot;},{&quot;linkId&quot;:&quot;reference-date&quot;,&quot;role&quot;:&quot;referenceDate&quot;}],&quot;output&quot;:{&quot;sdtmTarget&quot;:&quot;AGE.AGE&quot;},&quot;intent&quot;:&quot;生年月日と研究基準日から、基準日時点の年齢を年単位で導出する&quot;,&quot;derivationDescription&quot;:&quot;referenceDateからbirthDateを差し引いた期間を、基準日時点の年齢として年単位で表す。満年齢か小数年齢か、部分日付・閏日・丸め等の扱いは下流仕様で明示的に決定する。&quot;}\u003c/pre>\n\u003cfooter>Independent synthetic layout inspired only by the baseline blood-pressure research context of the \u003ca href=\"https://biolincc.nhlbi.nih.gov/studies/sprint/\">Systolic Blood Pressure Intervention Trial (SPRINT)\u003c/a>. No original form, logo, or affiliation. Source design: author-supplied revision 4 examples.\u003c/footer>\u003c/section>\u003c/body>\u003c/html>"];const frame=document.querySelector('iframe');const print=document.querySelector('#print');const show=i=>{print.disabled=true;frame.srcdoc=plans[i];document.querySelector('#status').textContent=i===0?'案１ / Plan 1: Concept authoring + separate explicit CRF mapping':'案２ / Plan 2: Dataset Specialization target authoring'};frame.onload=()=>{print.disabled=false};document.querySelector('#concept').onclick=()=>show(0);document.querySelector('#target').onclick=()=>show(1);print.onclick=()=>{frame.contentWindow.focus();frame.contentWindow.print()};show(0);</script></html>
